name: Test Bot

# Manual smoke test against the unscored bot-testing-area tournament.
on:
  workflow_dispatch:
    inputs:
      lanes:
        description: "Provider lanes to run"
        type: choice
        options:
          - both
          - claude
          - gpt
        default: both
      publish:
        description: "Submit the forecasts to the bot testing area"
        type: boolean
        default: true

# The job token is only used to check out this public repository.
permissions:
  contents: read

# Never run two copies of this workflow at the same time.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  forecast_job:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --locked
      - name: Run bot
        timeout-minutes: 40
        run: uv run python cirrus.py --mode test_questions --lanes "$LANES" $NO_PUBLISH
        env:
          LANES: ${{ inputs.lanes }}
          NO_PUBLISH: ${{ inputs.publish == false && '--no-publish' || '' }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not set; skipping the notification."
            exit 0
          fi
          payload=$(jq -n --arg content "cirrus: \"$WORKFLOW_NAME\" failed. $RUN_URL" '{content: $content}')
          curl -fsS -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL" > /dev/null
